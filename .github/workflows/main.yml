name: Build Flutter APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build_apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Ensure Android platform exists
        run: |
          if [ ! -d "android" ]; then
            flutter create --platforms=android .
          fi

      - name: Configure Android permissions
        run: |
          python3 -c '
          from pathlib import Path
          manifest_path = Path("android/app/src/main/AndroidManifest.xml")
          if manifest_path.exists():
              content = manifest_path.read_text(encoding="utf-8")
              perms = [
                  "android.permission.INTERNET",
                  "android.permission.ACCESS_FINE_LOCATION",
                  "android.permission.ACCESS_COARSE_LOCATION",
                  "android.permission.POST_NOTIFICATIONS",
              ]
              additions = "\n".join([f"    <uses-permission android:name=\"{p}\"/>" for p in perms if p not in content])
              if additions and "<application" in content:
                  content = content.replace("<application", additions + "\n\n    <application", 1)
                  manifest_path.write_text(content, encoding="utf-8")
          '

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: prayer-times-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          
